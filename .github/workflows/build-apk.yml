name: Build C.P.D SUPER WIZARD AI V7.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using SDK manager: $SDKMANAGER"

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager not found."
            echo "Using runner-installed Android SDK packages."
          fi

      - name: Find V7.6 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::V7.6 ZIP was not found."

            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -printf '%f\n' | sort

            exit 1
          fi

          echo "SOURCE ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP integrity..."

          unzip -tq "$ZIP_FILE"

          echo "ZIP INTEGRITY: PASS"

      - name: Extract V7.6 source
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/cpd_v76"
          mkdir -p "$RUNNER_TEMP/cpd_v76"

          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/cpd_v76"

          echo "V7.6 source extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do

            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then

              PROJECT_DIR="$CANDIDATE"
              break

            fi

          done < <(
            find "$RUNNER_TEMP/cpd_v76" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \)
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "::error::Android Gradle project not found."

            find "$RUNNER_TEMP/cpd_v76" \
              -maxdepth 6 \
              -type f | sort | head -300

            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force AndroidX configuration
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          echo ""
          echo "Configuring AndroidX..."

          if grep -q '^android.useAndroidX=' "$PROPERTIES"; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROPERTIES"
          else
            echo "android.useAndroidX=true" >> "$PROPERTIES"
          fi

          if grep -q '^android.enableJetifier=' "$PROPERTIES"; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROPERTIES"
          else
            echo "android.enableJetifier=true" >> "$PROPERTIES"
          fi

          echo ""
          echo "FINAL gradle.properties:"
          cat "$PROPERTIES"

          echo ""
          echo "Checking AndroidX configuration..."

          grep -q '^android.useAndroidX=true$' "$PROPERTIES"
          grep -q '^android.enableJetifier=true$' "$PROPERTIES"

          echo "ANDROIDX CONFIGURATION: PASS"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."

      - name: Verify Gradle AndroidX properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Gradle project:"
          pwd

          echo ""
          echo "AndroidX properties:"
          grep 'android.useAndroidX' gradle.properties
          grep 'android.enableJetifier' gradle.properties

          echo ""
          echo "Gradle version:"
          gradle --version

      - name: Build V7.6 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo " BUILDING C.P.D SUPER WIZARD AI V7.6"
          echo "=========================================="

          gradle \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            clean \
            :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not produced."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/final-apk/CPD_SUPER_WIZARD_AI_V7_6_BALANCED.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-APK
          path: final-apk/CPD_SUPER_WIZARD_AI_V7_6_BALANCED.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-V7.6-BUILD-LOG
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
