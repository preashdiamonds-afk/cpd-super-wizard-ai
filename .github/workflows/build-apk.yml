name: CPD-SUPER-WIZARD-AI-v1.8-CLOUD-QUALITY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=CPD_SUPER_WIZARD_AI_V2_ADVANCED_MULTI_ENGINE.zip
          unzip -oq "$ZIP_FILE"
          PROJECT_DIR=$(dirname "$(find . -type f -path '*/app/build.gradle' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V2-ADVANCED
          path:   ${{ env.PROJECT_DIR }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
