name: Build C.P.D SUPER WIZARD AI V3 PROTECTED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at:"
            echo "$SDKMANAGER"
            echo "Checking Android SDK:"
            ls -la "$ANDROID_HOME" || true
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract V3 project
        shell: bash
        run: |
          ZIP_FILE="CPD_SUPER_WIZARD_AI_V3_PROTECTED_DEMO_LIVE_LOCKED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V3 ZIP was not found:"
            echo "$ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE=$(find extracted_project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project was not found inside the V3 ZIP."
            find extracted_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build V3 APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK found: $APK_PATH"
          cp "$APK_PATH" CPD-SUPER-WIZARD-AI-V3-PROTECTED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V3-PROTECTED
          path: CPD-SUPER-WIZARD-AI-V3-PROTECTED.apk
          if-no-files-found: error
          retention-days: 7
