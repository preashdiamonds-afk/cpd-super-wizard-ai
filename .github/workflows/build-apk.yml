name: Build C.P.D SUPER WIZARD AI V7.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
  run: |
    SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)

    if [ -z "$SDKMANAGER" ]; then
      echo "sdkmanager was not found."
      exit 1
    fi

    echo "Using sdkmanager: $SDKMANAGER"
    yes | "$SDKMANAGER" --licenses >/dev/null || true
    "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        
          
        

      - name: Find V7.2 source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'CPD_SUPER_WIZARD_AI_V7_2_CLEAN_CLOUD_PROJECT.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "V7.2 source ZIP was not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate and extract source
        run: |
          unzip -t "$ZIP_FILE" >/dev/null
          rm -rf extracted_project
          mkdir extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted_project -type f -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted_project" ]; then
            PROJECT_DIR="extracted_project"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK was not created."
            exit 1
          fi

          echo "APK=$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.2-APK
          path: ${{ env.APK }}
