name: Build C.P.D SUPER WIZARD AI V7.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v7-6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 4. Gradle 8.9
      # ------------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # ------------------------------------------------------------
      # 5. Locate the ORIGINAL V7.6 master ZIP
      #
      # IMPORTANT:
      # The original ZIP is never modified.
      # ------------------------------------------------------------
      - name: Locate V7.6 master ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r candidate; do
            ZIP_FILE="$candidate"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT.zip' \
              -not -path '*/.git/*' \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V7.6 master ZIP was not found."
            echo
            echo "Expected exact filename:"
            echo "CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT.zip"
            echo
            echo "Upload that ZIP to the repository and run the workflow again."
            exit 1
          fi

          echo "Found V7.6 master ZIP:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "MASTER_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 6. Extract V7.6 into a temporary build directory
      # ------------------------------------------------------------
      - name: Extract V7.6 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v7_6_build"
          mkdir -p "$GITHUB_WORKSPACE/v7_6_build"

          unzip -oq "$MASTER_ZIP" \
            -d "$GITHUB_WORKSPACE/v7_6_build"

          echo "Searching for Gradle project..."

          PROJECT_DIR="$(
            find "$GITHUB_WORKSPACE/v7_6_build" \
              -type f \
              -name 'settings.gradle' \
              -print \
              -quit
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found inside the V7.6 ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "V7.6 project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 7. Verify this is really the V7.6 project
      # ------------------------------------------------------------
      - name: Verify V7.6 source contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required V7.6 components..."

          test -f "$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/pepestone/app/TradingController.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/pepestone/app/ExnessMt5Client.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/pepestone/app/BrokerApiClient.java"
          test -f "$PROJECT_DIR/mt5/CPD_SUPER_WIZARD_AI_BRIDGE.mq5"
          test -f "$PROJECT_DIR/bridge_server/server.py"

          echo "Required V7.6 trading/MT5/scanner files are present."

          echo
          echo "V7.6 documentation:"
          test -f "$PROJECT_DIR/V7_6_BALANCED_NO_OVERFIT.md" && \
            echo "  V7_6_BALANCED_NO_OVERFIT.md: OK" || true

          test -f "$PROJECT_DIR/V7_6_CORRECTIONS.md" && \
            echo "  V7_6_CORRECTIONS.md: OK" || true

      # ------------------------------------------------------------
      # 8. Enable AndroidX
      #
      # This is a build configuration repair only.
      # ------------------------------------------------------------
      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          if ! grep -q '^android.useAndroidX=true$' "$PROPERTIES"; then
            echo 'android.useAndroidX=true' >> "$PROPERTIES"
          fi

          if ! grep -q '^android.enableJetifier=true$' "$PROPERTIES"; then
            echo 'android.enableJetifier=true' >> "$PROPERTIES"
          fi

          echo "gradle.properties:"
          cat "$PROPERTIES"

      # ------------------------------------------------------------
      # 9. Repair ONLY the known CPDScannerEngine error
      #
      # Known bad call:
      #
      # return scan(symbol,data,screenshotReceived,null,null);
      #
      # Correct V7.6-compatible call:
      #
      # return scan(symbol,data,screenshotReceived,null);
      #
      # No other Java code is automatically rewritten here.
      # ------------------------------------------------------------
      - name: Repair known CPDScannerEngine call
        shell: bash
        run: |
          set -euo pipefail

          SCANNER="$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"

          test -f "$SCANNER"

          python3 - "$SCANNER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          bad = "return scan(symbol,data,screenshotReceived,null,null);"
          good = "return scan(symbol,data,screenshotReceived,null);"

          if bad in text:
              text = text.replace(bad, good)
              path.write_text(text, encoding="utf-8")
              print("Known CPDScannerEngine call repaired.")
          else:
              print("Known bad call was not present.")
              print("No speculative Java modification was made.")
          PY

          if grep -q \
            'return scan(symbol,data,screenshotReceived,null,null);' \
            "$SCANNER"; then

            echo "ERROR: Known invalid scanner call still exists."
            exit 1
          fi

          echo "CPDScannerEngine validation passed."

      # ------------------------------------------------------------
      # 10. Show important build configuration
      # ------------------------------------------------------------
      - name: Show V7.6 build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Root build.gradle -----"
          cat "$PROJECT_DIR/build.gradle"

          echo
          echo "----- app/build.gradle -----"
          cat "$PROJECT_DIR/app/build.gradle"

          echo
          echo "----- settings.gradle -----"
          cat "$PROJECT_DIR/settings.gradle"

      # ------------------------------------------------------------
      # 11. Build the EXISTING V7.6 project
      #
      # If another Java compiler error exists, Gradle stops here.
      # We do NOT guess or automatically modify unrelated source.
      # ------------------------------------------------------------
      - name: Build V7.6 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/v7_6_build.log"

      # ------------------------------------------------------------
      # 12. Find APK
      # ------------------------------------------------------------
      - name: Find built APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.6-debug.apk"

          echo "APK_FILE=$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.6-debug.apk" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 13. Create corrected V7.6 source ZIP
      #
      # The ORIGINAL master ZIP remains untouched.
      # ------------------------------------------------------------
      - name: Create corrected V7.6 ZIP
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_CORRECTED.zip"

          rm -f "$OUTPUT"

          cd "$PROJECT_DIR"

          zip -qr "$OUTPUT" . \
            -x '*.gradle/*' \
            -x '*/build/*' \
            -x '.gradle/*' \
            -x '.idea/*' \
            -x '*.iml'

          echo "Corrected V7.6 ZIP created:"
          echo "$OUTPUT"

          unzip -t "$OUTPUT" >/dev/null

      # ------------------------------------------------------------
      # 14. Upload APK + corrected source ZIP
      # ------------------------------------------------------------
      - name: Upload V7.6 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD
          path: |
            CPD-SUPER-WIZARD-AI-V7.6-debug.apk
            CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_CORRECTED.zip
          if-no-files-found: error

      # ------------------------------------------------------------
      # 15. Upload build log separately
      #
      # Useful if the next real compiler error appears.
      # ------------------------------------------------------------
      - name: Upload V7.6 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD-LOG
          path: v7_6_build.log
          if-no-files-found: ignore
