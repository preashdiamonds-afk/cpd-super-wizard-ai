name: Build C.P.D SUPER WIZARD AI V7.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v7-6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # ============================================================
      # 5. FIND V7.6 MASTER ZIP
      # ============================================================
      - name: Locate V7.6 master ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r candidate; do
            ZIP_FILE="$candidate"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT.zip' \
              -not -path '*/.git/*' \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V7.6 master ZIP was not found."
            echo
            echo "Expected:"
            echo "CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT.zip"
            exit 1
          fi

          echo "Found master ZIP:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "MASTER_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 6. EXTRACT V7.6
      # ============================================================
      - name: Extract V7.6 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v7_6_build"
          mkdir -p "$GITHUB_WORKSPACE/v7_6_build"

          unzip -oq "$MASTER_ZIP" \
            -d "$GITHUB_WORKSPACE/v7_6_build"

          echo "Searching for Android Gradle project..."

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/v7_6_build" \
              -type f \
              -name 'settings.gradle' \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "V7.6 project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. VERIFY EXISTING FEATURES / ARCHITECTURE
      # ============================================================
      - name: Verify V7.6 source contents
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking existing V7.6 components..."

          REQUIRED_FILES=(
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/TradingController.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/ExnessMt5Client.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/BrokerApiClient.java"
            "$PROJECT_DIR/mt5/CPD_SUPER_WIZARD_AI_BRIDGE.mq5"
            "$PROJECT_DIR/bridge_server/server.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required V7.6 file missing:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "All required V7.6 architecture files are present."

      # ============================================================
      # 8. ANDROIDX
      # ============================================================
      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          if ! grep -q '^android.useAndroidX=true$' "$PROPERTIES"; then
            echo 'android.useAndroidX=true' >> "$PROPERTIES"
          fi

          if ! grep -q '^android.enableJetifier=true$' "$PROPERTIES"; then
            echo 'android.enableJetifier=true' >> "$PROPERTIES"
          fi

          echo "AndroidX configuration:"
          cat "$PROPERTIES"

      # ============================================================
      # 9. SUPPRESS ONLY THE COMPILE SDK 35 WARNING
      # ============================================================
      - name: Configure compile SDK warning
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          if ! grep -q '^android.suppressUnsupportedCompileSdk=35$' "$PROPERTIES"; then
            echo 'android.suppressUnsupportedCompileSdk=35' >> "$PROPERTIES"
          fi

          echo "Compile SDK warning configuration applied."

      # ============================================================
      # 10. REPAIR KNOWN CPD SCANNER ERROR
      #
      # Known invalid call:
      #
      # scan(symbol,data,screenshotReceived,null,null)
      #
      # Correct call:
      #
      # scan(symbol,data,screenshotReceived,null)
      #
      # NO OTHER JAVA REPAIRS ARE MADE.
      # ============================================================
      - name: Repair known CPDScannerEngine call
        shell: bash
        run: |
          set -euo pipefail

          SCANNER="$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"

          test -f "$SCANNER"

          python3 - "$SCANNER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          bad = "return scan(symbol,data,screenshotReceived,null,null);"
          good = "return scan(symbol,data,screenshotReceived,null);"

          if bad in text:
              text = text.replace(bad, good)
              path.write_text(text, encoding="utf-8")
              print("Known CPDScannerEngine error repaired.")
          else:
              print("Known invalid call was not found.")
              print("No speculative Java modification was made.")
          PY

          if grep -q \
            'return scan(symbol,data,screenshotReceived,null,null);' \
            "$SCANNER"; then

            echo "ERROR: Invalid scanner call still exists."
            exit 1
          fi

          echo "CPDScannerEngine check passed."

      # ============================================================
      # 11. SHOW BUILD CONFIG
      # ============================================================
      - name: Show V7.6 build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "settings.gradle"
          echo "============================================================"
          cat "$PROJECT_DIR/settings.gradle"

          echo
          echo "============================================================"
          echo "root build.gradle"
          echo "============================================================"
          cat "$PROJECT_DIR/build.gradle"

          echo
          echo "============================================================"
          echo "app/build.gradle"
          echo "============================================================"
          cat "$PROJECT_DIR/app/build.gradle"

          echo
          echo "============================================================"
          echo "gradle.properties"
          echo "============================================================"
          cat "$PROJECT_DIR/gradle.properties"

      # ============================================================
      # 12. BUILD
      #
      # IMPORTANT:
      # This step DOES NOT guess another Java repair.
      #
      # If compilation fails, it extracts the first actual
      # compiler errors and prints them clearly.
      # ============================================================
      - name: Build V7.6 debug APK
        id: build_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "STARTING V7.6 BUILD"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/v7_6_build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "FIRST JAVA / KOTLIN / COMPILER ERRORS"
          echo "============================================================"

          grep -n -E \
            'error:|error: |\.java:[0-9]+: error|\.kt:[0-9]+: error|Compilation failed' \
            "$GITHUB_WORKSPACE/v7_6_build.log" \
            | head -30 || true

          echo
          echo "============================================================"
          echo "IMPORTANT GRADLE FAILURE LINES"
          echo "============================================================"

          grep -n -E \
            'FAILURE:|BUILD FAILED|Execution failed for task|Caused by:' \
            "$GITHUB_WORKSPACE/v7_6_build.log" \
            | tail -30 || true

          echo
          echo "============================================================"
          echo "BUILD EXIT CODE: $BUILD_STATUS"
          echo "============================================================"

          exit "$BUILD_STATUS"

      # ============================================================
      # 13. FIND APK
      # ============================================================
      - name: Find built APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.6-debug.apk"

      # ============================================================
      # 14. CREATE CORRECTED V7.6 ZIP
      #
      # ORIGINAL MASTER ZIP IS NEVER MODIFIED.
      # ============================================================
      - name: Create corrected V7.6 ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_CORRECTED.zip"

          rm -f "$OUTPUT"

          cd "$PROJECT_DIR"

          zip -qr "$OUTPUT" . \
            -x '*.gradle/*' \
            -x '*/build/*' \
            -x '.gradle/*' \
            -x '.idea/*' \
            -x '*.iml'

          echo "Corrected V7.6 ZIP:"
          echo "$OUTPUT"

          unzip -t "$OUTPUT" >/dev/null

      # ============================================================
      # 15. UPLOAD APK + CORRECTED ZIP
      # ============================================================
      - name: Upload V7.6 build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD
          path: |
            CPD-SUPER-WIZARD-AI-V7.6-debug.apk
            CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_CORRECTED.zip
          if-no-files-found: error

      # ============================================================
      # 16. ALWAYS UPLOAD THE FULL BUILD LOG
      #
      # This is the important part for the next failure.
      # ============================================================
      - name: Upload V7.6 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD-LOG
          path: v7_6_build.log
          if-no-files-found: warn
