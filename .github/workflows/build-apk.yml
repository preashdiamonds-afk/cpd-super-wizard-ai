name: Build C.P.D SUPER WIZARD AI V3 PROTECTED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract V3 project
        run: |
          ZIP_FILE=CPD_SUPER_WIZARD_AI_V3_PROTECTED_DEMO_LIVE_LOCKED.zip

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V3 ZIP was not found:"
            echo "$ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(dirname "$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project was not found inside the V3 ZIP."
            find extracted_project -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build V3 APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK found: $APK_PATH"
          cp "$APK_PATH" CPD-SUPER-WIZARD-AI-V3-PROTECTED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V3-PROTECTED
          path: CPD-SUPER-WIZARD-AI-V3-PROTECTED.apk
          if-no-files-found: error
          retention-days: 7
