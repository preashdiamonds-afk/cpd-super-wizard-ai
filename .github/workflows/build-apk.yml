name: Build C.P.D SUPER WIZARD AI V7 PREBUILD CORRECTED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract V7 project
        run: |
          ZIP_FILE="CPD_SUPER_WIZARD_AI_V7_PREBUILD_CORRECTED_LIVE_LOCKED.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          }

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(dirname "$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)")

          test -n "$PROJECT_DIR" && test "$PROJECT_DIR" != "." || {
            echo "ERROR: Android project not found"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build V7 APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          test -n "$APK_PATH" || {
            echo "ERROR: No APK produced"
            exit 1
          }

          cp "$APK_PATH" \
            CPD-SUPER-WIZARD-AI-V7-PREBUILD-CORRECTED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7-PREBUILD-CORRECTED
          path: CPD-SUPER-WIZARD-AI-V7-PREBUILD-CORRECTED.apk
          if-no-files-found: error
          retention-days: 7
