name: Build C.P.D SUPER WIZARD AI V7.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v7-6:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            -print \
            -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # ============================================================
      # 5. LOCATE CORRECT V7.6 ZIP
      # ============================================================
      - name: Locate V7.6 master ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r candidate; do
            ZIP_FILE="$candidate"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_ALL_CORRECTIONS_FIXED.zip' \
              -not -path '*/.git/*' \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Corrected V7.6 ZIP was not found."
            echo
            echo "Expected exact filename:"
            echo "CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_ALL_CORRECTIONS_FIXED.zip"
            echo
            echo "Make sure the ZIP is uploaded to the repository."
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE" >/dev/null

          echo "MASTER_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 6. EXTRACT PROJECT
      # ============================================================
      - name: Extract V7.6 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v7_6_build"

          mkdir -p "$GITHUB_WORKSPACE/v7_6_build"

          unzip -oq \
            "$MASTER_ZIP" \
            -d "$GITHUB_WORKSPACE/v7_6_build"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/v7_6_build" \
              -type f \
              -name 'settings.gradle' \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. VERIFY V7.6 ARCHITECTURE
      # ============================================================
      - name: Verify V7.6 architecture
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/TradingController.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/ExnessMt5Client.java"
            "$PROJECT_DIR/app/src/main/java/com/pepestone/app/BrokerApiClient.java"
            "$PROJECT_DIR/mt5/CPD_SUPER_WIZARD_AI_BRIDGE.mq5"
            "$PROJECT_DIR/bridge_server/server.py"
          )

          echo "Checking required V7.6 components..."

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo
          echo "V7.6 architecture verification passed."

      # ============================================================
      # 8. ANDROIDX
      # ============================================================
      - name: Enable AndroidX and Jetifier
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          grep -q '^android.useAndroidX=true$' "$PROPERTIES" \
            || echo 'android.useAndroidX=true' >> "$PROPERTIES"

          grep -q '^android.enableJetifier=true$' "$PROPERTIES" \
            || echo 'android.enableJetifier=true' >> "$PROPERTIES"

          grep -q '^android.suppressUnsupportedCompileSdk=35$' "$PROPERTIES" \
            || echo 'android.suppressUnsupportedCompileSdk=35' >> "$PROPERTIES"

          echo "----- gradle.properties -----"
          cat "$PROPERTIES"

      # ============================================================
      # 9. KNOWN SCANNER REPAIR
      # ============================================================
      - name: Verify and repair known scanner call
        shell: bash
        run: |
          set -euo pipefail

          SCANNER="$PROJECT_DIR/app/src/main/java/com/pepestone/app/CPDScannerEngine.java"

          test -f "$SCANNER"

          python3 - "$SCANNER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          bad = "return scan(symbol,data,screenshotReceived,null,null);"
          good = "return scan(symbol,data,screenshotReceived,null);"

          if bad in text:
              text = text.replace(bad, good)
              path.write_text(text, encoding="utf-8")
              print("Known scanner call repaired.")
          else:
              print("Known scanner call already correct.")
          PY

          if grep -q \
            'return scan(symbol,data,screenshotReceived,null,null);' \
            "$SCANNER"; then

            echo "ERROR: Invalid scanner call remains."
            exit 1
          fi

          echo "Scanner verification passed."

      # ============================================================
      # 10. CHECK PROJECT VERSION
      # ============================================================
      - name: Verify V7.6 version identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking active V7.6 version identity..."

          grep -Rni \
            -E \
            'versionName|versionCode|SUPER WIZARD AI V7\.6|version.*7\.6' \
            "$PROJECT_DIR/app" \
            "$PROJECT_DIR/mt5" \
            2>/dev/null \
            | head -100 || true

          echo
          echo "Version identity check completed."

      # ============================================================
      # 11. BUILD
      #
      # NO SPECULATIVE JAVA FIXES ARE PERFORMED.
      # ============================================================
      - name: Build V7.6 debug APK
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "C.P.D SUPER WIZARD AI V7.6 BUILD"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/v7_6_build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "FIRST ACTUAL COMPILER ERRORS"
          echo "============================================================"

          grep -n -E \
            '(^|[^A-Za-z])error:|\.java:[0-9]+: error|\.kt:[0-9]+: error|Compilation failed' \
            "$GITHUB_WORKSPACE/v7_6_build.log" \
            | head -40 || true

          echo
          echo "============================================================"
          echo "GRADLE FAILURE SUMMARY"
          echo "============================================================"

          grep -n -E \
            'FAILURE:|BUILD FAILED|Execution failed for task|Caused by:' \
            "$GITHUB_WORKSPACE/v7_6_build.log" \
            | tail -40 || true

          echo
          echo "============================================================"
          echo "BUILD EXIT CODE: $BUILD_STATUS"
          echo "============================================================"

          exit "$BUILD_STATUS"

      # ============================================================
      # 12. FIND APK
      # ============================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.6-debug.apk"

      # ============================================================
      # 13. CREATE CORRECTED PROJECT ZIP
      # ============================================================
      - name: Create corrected V7.6 source ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_BUILD_READY.zip"

          rm -f "$OUTPUT"

          cd "$PROJECT_DIR"

          zip -qr "$OUTPUT" . \
            -x '*/build/*' \
            -x '.gradle/*' \
            -x '.idea/*' \
            -x '*.iml'

          unzip -t "$OUTPUT" >/dev/null

          echo "Corrected source ZIP:"
          echo "$OUTPUT"

      # ============================================================
      # 14. UPLOAD APK + SOURCE ZIP
      # ============================================================
      - name: Upload successful V7.6 artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD
          path: |
            CPD-SUPER-WIZARD-AI-V7.6-debug.apk
            CPD_SUPER_WIZARD_AI_V7_6_BALANCED_NO_OVERFIT_BUILD_READY.zip
          if-no-files-found: error

      # ============================================================
      # 15. ALWAYS UPLOAD BUILD LOG
      # ============================================================
      - name: Upload V7.6 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.6-BUILD-LOG
          path: v7_6_build.log
          if-no-files-found: warn
