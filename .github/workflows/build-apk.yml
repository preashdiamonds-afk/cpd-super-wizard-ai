name: Build C.P.D SUPER WIZARD AI V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget unzip

          ANDROID_HOME="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "Downloading Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-cmdline-tools.zip

          rm -rf /tmp/android-tools
          mkdir -p /tmp/android-tools

          unzip -q \
            /tmp/android-cmdline-tools.zip \
            -d /tmp/android-tools

          SDKMANAGER="$(find /tmp/android-tools \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found after downloading Android tools."
            find /tmp/android-tools -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R \
            "$(dirname "$(dirname "$SDKMANAGER")")/." \
            "$ANDROID_HOME/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          echo "Using:"
          echo "$SDKMANAGER"

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."

          "$SDKMANAGER" --version

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract V7 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="CPD_SUPER_WIZARD_AI_V7_PREBUILD_CORRECTED_LIVE_LOCKED.zip"

          echo "Checking for V7 ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V7 ZIP was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "V7 ZIP found."

          rm -rf extracted_project

          mkdir -p extracted_project

          unzip -oq \
            "$ZIP_FILE" \
            -d extracted_project

          echo "Finding Android project..."

          SETTINGS_FILE="$(find extracted_project \
            -type f \
            \( \
              -name settings.gradle \
              -o \
              -name settings.gradle.kts \
            \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle file was not found."
            find extracted_project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "Starting C.P.D SUPER WIZARD AI V7 build..."

          cd "$PROJECT_DIR"

          echo "Running Gradle..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo "Gradle build completed."

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not created."

            echo "Searching build directory..."
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          cp "$APK_PATH" \
            CPD-SUPER-WIZARD-AI-V7.apk

          ls -lh CPD-SUPER-WIZARD-AI-V7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
          retention-days: 7
