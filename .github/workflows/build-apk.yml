name: Build C.P.D SUPER WIZARD AI V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract V7 project
        run: |
          ZIP_FILE="CPD_SUPER_WIZARD_AI_V7_PREBUILD_CORRECTED_LIVE_LOCKED.zip"

          test -f "$ZIP_FILE"

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          PROJECT_DIR=$(dirname "$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)")

          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          test -n "$APK_PATH"

          cp "$APK_PATH" \
            CPD-SUPER-WIZARD-AI-V7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
