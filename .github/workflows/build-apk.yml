name: Build C.P.D SUPER WIZARD AI V7.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK was not found."
            exit 1
          fi

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          else
            echo "sdkmanager not found."
            echo "Using Android SDK packages already installed."
          fi

      - name: Find V7.2 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name 'CPD_SUPER_WIZARD_AI_V7_2_ADAPTIVE_REGIME_STEP1.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Step 1 ZIP was not found."
            echo "Files in repository root:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Validate source ZIP
        shell: bash
        run: |
          set -e

          unzip -tq "$ZIP_FILE"

          echo "ZIP validation successful."

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/cpd_source"
          mkdir -p "$RUNNER_TEMP/cpd_source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/cpd_source"

          echo "Source extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then

              PROJECT_DIR="$CANDIDATE"
              break
            fi

          done < <(
            find "$RUNNER_TEMP/cpd_source" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android Gradle project was found."

            find "$RUNNER_TEMP/cpd_source" \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."

            find "$PROJECT_DIR" \
              -type f \
              | grep -E '\.apk$|build/outputs' \
              || true

            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/final-apk/CPD_SUPER_WIZARD_AI_V7.2_ADAPTIVE_REGIME.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.2-ADAPTIVE-REGIME-APK
          path: final-apk/CPD_SUPER_WIZARD_AI_V7.2_ADAPTIVE_REGIME.apk
          if-no-files-found: error
