name: C.P.D SUPER WIZARD AI V7 - Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build C.P.D SUPER WIZARD AI V7
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # 1. Get the repository
      - name: 1 - Check out source
        uses: actions/checkout@v4

      # 2. Java required by Android/Gradle
      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android SDK
      - name: 3 - Install Android SDK
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget unzip

          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "Downloading Android command-line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-cmdline-tools.zip

          rm -rf /tmp/android-tools
          mkdir -p /tmp/android-tools

          unzip -q \
            /tmp/android-cmdline-tools.zip \
            -d /tmp/android-tools

          SDKMANAGER="$(find /tmp/android-tools \
            -type f \
            -name sdkmanager \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R \
            "$(dirname "$(dirname "$SDKMANAGER")")/." \
            "$ANDROID_HOME/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # 4. Gradle
      - name: 4 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 5. Automatically find ANY V7 CPD ZIP in repository root
      - name: 5 - Find and extract V7 project
        shell: bash
        run: |
          set -e

          echo "Searching repository root for C.P.D V7 ZIP..."

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'CPD_SUPER_WIZARD_AI_V7*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No CPD V7 ZIP was found."
            echo ""
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "V7 package selected:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -oq "$ZIP_FILE" -d extracted_project

          echo "Searching for Android project..."

          SETTINGS_FILE="$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "Contents of extracted package:"
            find extracted_project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Build the Android APK
      - name: 6 - Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building C.P.D SUPER WIZARD AI V7..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo "APK build completed."

      # 7. Locate APK
      - name: 7 - Find APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not produced."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          cp "$APK_PATH" CPD-SUPER-WIZARD-AI-V7.apk

          ls -lh CPD-SUPER-WIZARD-AI-V7.apk

      # 8. Give the APK to GitHub Actions
      - name: 8 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
          retention-days: 7
