name: Build C.P.D SUPER WIZARD AI V7.1 FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 5 - Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 6 - Find and extract the V7.1 project
        shell: bash
        run: |
          set -e
          if [ -f "CPD_SUPER_WIZARD_AI_V7_1_PREMIUM_DEMO_LIVE_LESSONS_FIXED.zip" ]; then
            ZIP_FILE="CPD_SUPER_WIZARD_AI_V7_1_PREMIUM_DEMO_LIVE_LESSONS_FIXED.zip"
          elif [ -f "CPD_SUPER_WIZARD_AI_V7_1_PREMIUM_DEMO_LIVE_LESSONS.zip" ]; then
            ZIP_FILE="CPD_SUPER_WIZARD_AI_V7_1_PREMIUM_DEMO_LIVE_LESSONS.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'CPD_SUPER_WIZARD_AI_V7*.zip' -print -quit)"
          fi
          test -n "$ZIP_FILE" || { echo "ERROR: V7/V7.1 ZIP not found"; exit 1; }
          echo "Using ZIP: $ZIP_FILE"
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          PROJECT_DIR="$(find extracted_project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || { echo "ERROR: Android Gradle project not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: 7 - Repair V7.1 Java source before compiling
        shell: bash
        run: |
          set -e
          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -type f -name MainActivity.java -print -quit)"
          test -n "$MAIN_ACTIVITY" || { echo "ERROR: MainActivity.java not found"; exit 1; }

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          # V7.1 had an accidental real newline inside this Java string.
          s = s.replace('connectionState=tv("● BRIDGE STATUS\\nCHECKING…",14,green);',
                        'connectionState=tv("● BRIDGE STATUS\\\\nCHECKING…",14,green);')
          # Also accept the exact broken form with a real newline.
          s = s.replace('connectionState=tv("● BRIDGE STATUS\nCHECKING…",14,green);',
                        'connectionState=tv("● BRIDGE STATUS\\nCHECKING…",14,green);')
          p.write_text(s)
          PY

          echo "Checking repaired line:"
          grep -n -A1 -B1 'connectionState=tv' "$MAIN_ACTIVITY" || true

      - name: 8 - Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 9 - Find APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: APK was not created"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.1-FIXED.apk"
          echo "APK: $APK"

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.1-FIXED
          path: CPD-SUPER-WIZARD-AI-V7.1-FIXED.apk
          if-no-files-found: error
