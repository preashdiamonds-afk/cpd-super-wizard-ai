name: Build C.P.D SUPER WIZARD AI V7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: 5 - Download and prepare V7 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for the V7 ZIP..."

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -name 'CPD_SUPER_WIZARD_AI_V7*.zip' -o -name 'CPD-SUPER-WIZARD-AI-V7*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No V7 ZIP was found."
            echo "Upload exactly one CPD_SUPER_WIZARD_AI_V7*.zip file to the repository."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR="$(find extracted_project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Android project directory was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: 6 - Repair Java imports
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -type f \
            -name 'MainActivity.java' -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java was not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          # Add JSONObject import if missing.
          if ! grep -q '^import org\.json\.JSONObject;' "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import org.json.JSONObject;' "$MAIN_ACTIVITY"
          fi

          # Add JSONArray import if missing.
          if ! grep -q '^import org\.json\.JSONArray;' "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import org.json.JSONArray;' "$MAIN_ACTIVITY"
          fi

          echo "Verified JSON imports:"
          grep -n '^import org\.json' "$MAIN_ACTIVITY" || true

          echo "MainActivity beginning:"
          head -n 30 "$MAIN_ACTIVITY"

      - name: 7 - Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: 8 - Find APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.apk"

      - name: 9 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
