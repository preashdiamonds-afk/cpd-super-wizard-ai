name: Build C.P.D SUPER WIZARD AI V7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Install required Android packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: 5 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 6 - Find and extract V7 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'CPD_SUPER_WIZARD_AI_V7*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V7 ZIP file was not found."
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found V7 ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          PROJECT_DIR="$(find extracted_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            find extracted_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: 7 - Correct V7 Java JSON imports
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR" -type f -name 'MainActivity.java' -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java was not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          if ! grep -q '^import org\.json\.JSONObject;' "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import org.json.JSONObject;' "$MAIN_ACTIVITY"
          fi

          if ! grep -q '^import org\.json\.JSONArray;' "$MAIN_ACTIVITY"; then
            sed -i '/^package /a import org.json.JSONArray;' "$MAIN_ACTIVITY"
          fi

          echo "JSON imports:"
          grep -n 'import org.json' "$MAIN_ACTIVITY" || true

      - name: 8 - Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building project from:"
          pwd

          echo "Gradle version:"
          gradle --version

          echo "Starting Android build..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: 9 - Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/CPD-SUPER-WIZARD-AI-V7.apk"

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
