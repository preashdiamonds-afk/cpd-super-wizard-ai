name: Build C.P.D SUPER WIZARD AI V7.1 — FINAL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Prepare GitHub Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK: $SDK_ROOT"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools/latest/bin"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: 4 - Install Android 35 components
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 5 - Locate and extract fixed V7.1 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="CPD_SUPER_WIZARD_AI_V7_1_FINAL_SOURCE_FIXED.zip"
          FOUND="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "$ZIP" -print -quit)"
          if [ -z "$FOUND" ]; then
            echo "::error::Missing $ZIP in repository root."
            echo "Repository ZIP files found:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name '*.zip' -print
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/cpd_v71_build"
          mkdir -p "$GITHUB_WORKSPACE/cpd_v71_build"
          unzip -q "$FOUND" -d "$GITHUB_WORKSPACE/cpd_v71_build"
          PROJECT="$(find "$GITHUB_WORKSPACE/cpd_v71_build" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT" ]; then
            echo "::error::Gradle settings.gradle not found inside fixed source ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"

      - name: 6 - Verify fixed source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/pepestone/app/MainActivity.java"
          test -f "$SRC"
          grep -q 'private Runnable bridgeRefresh;' "$SRC"
          grep -q 'private Runnable normalLoop;' "$SRC"
          echo "Source verification passed."

      - name: 7 - Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: 8 - Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: 9 - Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.1-FINAL-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
