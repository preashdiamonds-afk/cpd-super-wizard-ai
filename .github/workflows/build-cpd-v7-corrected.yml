name: Build C.P.D SUPER WIZARD AI V7 - Corrected

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build C.P.D SUPER WIZARD AI V7
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Install required Android packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK: $SDK"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo "Android SDK ready."

      - name: 5 - Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 6 - Find and extract V7 project
        shell: bash
        run: |
          set -e

          echo "Searching for the V7 ZIP..."

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname 'CPD_SUPER_WIZARD_AI_V7*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No CPD V7 ZIP found in repository root."
            echo "ZIP files found:"
            find . -maxdepth 1 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -oq "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE="$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Android settings.gradle/settings.gradle.kts found."
            find extracted_project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: 7 - Correct V7 Java JSON imports
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/src/main/java/*/MainActivity.java' \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "Checking: $MAIN_ACTIVITY"

          # The previous V7 build failed because MainActivity.java
          # uses JSONObject but did not import it.
          if ! grep -q '^import org\.json\.JSONObject;' "$MAIN_ACTIVITY"; then
            sed -i '/^package .*;/a import org.json.JSONObject;' "$MAIN_ACTIVITY"
            echo "Added missing JSONObject import."
          else
            echo "JSONObject import already present."
          fi

          # Add JSONArray too if the source uses JSONArray without an import.
          if grep -q 'JSONArray' "$MAIN_ACTIVITY" && \
             ! grep -q '^import org\.json\.JSONArray;' "$MAIN_ACTIVITY"; then
            sed -i '/^package .*;/a import org.json.JSONArray;' "$MAIN_ACTIVITY"
            echo "Added missing JSONArray import."
          fi

          echo "Final JSON imports:"
          grep '^import org\.json\.' "$MAIN_ACTIVITY" || true

      - name: 8 - Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building C.P.D SUPER WIZARD AI V7..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo "APK build completed."

      - name: 9 - Find APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not produced."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK found: $APK_PATH"

          cp "$APK_PATH" CPD-SUPER-WIZARD-AI-V7.apk

          ls -lh CPD-SUPER-WIZARD-AI-V7.apk

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7-CORRECTED
          path: CPD-SUPER-WIZARD-AI-V7.apk
          if-no-files-found: error
          retention-days: 7
