name: Build C.P.D SUPER WIZARD AI V7.1 FINAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 35 components
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find a VALID V7.1 source ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/cpd_source"
          mkdir -p "$RUNNER_TEMP/cpd_source"

          echo "ZIP files found in repository:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
            \( -iname '*.zip' \) -print

          FOUND=""

          # Test every V7.1 ZIP. Bad/incomplete ZIPs are skipped.
          while IFS= read -r ZIP; do
            echo ""
            echo "Testing: $ZIP"

            if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
              echo "SKIP: invalid/incomplete ZIP"
              continue
            fi

            if ! unzip -l "$ZIP" | grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'; then
              echo "SKIP: no settings.gradle"
              continue
            fi

            if ! unzip -l "$ZIP" | grep -Eq '(^|/)app/build\.gradle(\.kts)?$'; then
              echo "SKIP: no app/build.gradle"
              continue
            fi

            FOUND="$ZIP"
            echo "VALID V7.1 PROJECT ZIP FOUND: $FOUND"
            break
          done < <(
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \
              \( -iname '*V7.1*.zip' -o -iname '*V7_1*.zip' \) | sort
          )

          if [ -z "$FOUND" ]; then
            echo "::error::No valid V7.1 Gradle project ZIP was found."
            echo "The repository contains ZIP files, but none passed validation."
            exit 1
          fi

          echo "Using source ZIP: $FOUND"
          unzip -q "$FOUND" -d "$RUNNER_TEMP/cpd_source"

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/cpd_source" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Valid ZIP found, but no Android Gradle project was inside it."
            find "$RUNNER_TEMP/cpd_source" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          mkdir -p final-apk
          cp "$APK" final-apk/CPD_SUPER_WIZARD_AI_V7.1_FINAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.1-FINAL-APK
          path: final-apk/CPD_SUPER_WIZARD_AI_V7.1_FINAL.apk
          if-no-files-found: error
