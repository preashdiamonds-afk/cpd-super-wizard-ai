name: Build C.P.D SUPER WIZARD AI V7.1 — FINAL CLEAN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1 - Check out source
        uses: actions/checkout@v4

      - name: 2 - Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 5 - Find and extract the FIXED V7.1 source
        shell: bash
        run: |
          set -e
          ZIP="CPD_SUPER_WIZARD_AI_V7_1_FINAL_SOURCE_FIXED.zip"
          echo "Searching for: $ZIP"
          FOUND="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "$ZIP" | head -n 1)"
          if [ -z "$FOUND" ]; then
            echo "::error::The fixed V7.1 source ZIP was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          echo "Using source: $FOUND"
          rm -rf "$GITHUB_WORKSPACE/cpd_v71_build"
          mkdir -p "$GITHUB_WORKSPACE/cpd_v71_build"
          unzip -q "$FOUND" -d "$GITHUB_WORKSPACE/cpd_v71_build"
          PROJECT="$(find "$GITHUB_WORKSPACE/cpd_v71_build" -name settings.gradle -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "::error::settings.gradle was not found in the fixed source ZIP."
            find "$GITHUB_WORKSPACE/cpd_v71_build" -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: 6 - Verify fixed Java source
        shell: bash
        run: |
          set -e
          SRC="$PROJECT_DIR/app/src/main/java/com/pepestone/app/MainActivity.java"
          if [ ! -f "$SRC" ]; then
            echo "::error::MainActivity.java was not found."
            exit 1
          fi
          if ! grep -q "private Runnable bridgeRefresh;" "$SRC"; then
            echo "::error::Expected bridgeRefresh declaration is missing."
            exit 1
          fi
          if ! grep -q "private Runnable normalLoop;" "$SRC"; then
            echo "::error::Expected normalLoop declaration is missing."
            exit 1
          fi
          echo "Fixed source verification passed."

      - name: 7 - Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: 8 - Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -x "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: 9 - Find APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: 10 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.1-FINAL-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
