name: Build C.P.D SUPER WIZARD AI V7.1 FINAL APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 35 components
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Find and validate V7.1 source
        shell: bash
        run: |
          set -e

          PREFERRED="$GITHUB_WORKSPACE/CPD_SUPER_WIZARD_AI_V7_1_PREMIUM_DEMO_LIVE_LESSONS_ONLY_LINE_FIX.zip"

          if [ -f "$PREFERRED" ]; then
            ZIP="$PREFERRED"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \( -iname '*V7.1*.zip' -o -iname '*V7_1*.zip' \) | sort | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::V7.1 source ZIP was not found in the repository."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using: $ZIP"

          if ! unzip -tq "$ZIP" >/dev/null; then
            echo "::error::The selected V7.1 ZIP is invalid or incomplete."
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/cpd_source"
          mkdir -p "$RUNNER_TEMP/cpd_source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/cpd_source"

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -f "$CANDIDATE/app/build.gradle" ] || [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$RUNNER_TEMP/cpd_source" -type f \( -name settings.gradle -o -name settings.gradle.kts \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android Gradle project was found inside the V7.1 ZIP."
            find "$RUNNER_TEMP/cpd_source" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Build finished but no APK was produced."
            exit 1
          fi

          mkdir -p final-apk
          cp "$APK" final-apk/CPD_SUPER_WIZARD_AI_V7.1_FINAL.apk
          ls -lh final-apk/CPD_SUPER_WIZARD_AI_V7.1_FINAL.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPD-SUPER-WIZARD-AI-V7.1-FINAL-APK
          path: final-apk/CPD_SUPER_WIZARD_AI_V7.1_FINAL.apk
          if-no-files-found: error
