name: C.P.D Cloud Market Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate and extract C.P.D project ZIP
        run: |
          ZIP_FILE="CPD_SUPER_WIZARD_AI_v1_8_1_CLOUD_QUALITY_FIXED.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; exit 1; }

          rm -rf .cpd_cloud_project
          mkdir .cpd_cloud_project

          unzip -oq "$ZIP_FILE" -d .cpd_cloud_project

          SCRIPT=$(find .cpd_cloud_project -type f -path '*/cloud/signal_worker.py' | head -n 1)

          test -n "$SCRIPT" || {
            echo "cloud/signal_worker.py not found in ZIP"
            exit 1
          }

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PROJECT_CLOUD=$(dirname "$SCRIPT")" >> "$GITHUB_ENV"

      - name: Run C.P.D quality scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python3 "$SCRIPT"

      - name: Publish scanner state
        run: |
          mkdir -p cloud
          cp "$PROJECT_CLOUD/signals.json" cloud/signals.json

          git config user.name "C.P.D Cloud Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cloud/signals.json

          if git diff --cached --quiet; then
            echo "No scanner-state change."
          else
            git commit -m "Update C.P.D cloud signal state"
            git push
          fi

      - name: Complete 2-minute warning
        run: |
          sleep 125

          python3 - "$PROJECT_CLOUD/signals.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          path = sys.argv[1]

          with open(path, "r") as f:
              data = json.load(f)

          active = data.get("active")

          if active and active.get("status") == "INCOMING":
              try:
                  publish_at = datetime.fromisoformat(
                      active["publish_at"].replace("Z", "+00:00")
                  )

                  now = datetime.now(timezone.utc)

                  if now >= publish_at:
                      active["status"] = "PUBLISHED"
                      active["published_at"] = now.isoformat()
                      active["updated_at"] = now.isoformat()

                      data["updated_at"] = now.isoformat()
                      data["status"] = (
                          "SIGNAL PUBLISHED • "
                          + active.get("symbol", "")
                          + " "
                          + active.get("direction", "")
                      )

                      with open(path, "w") as f:
                          json.dump(data, f, indent=2)

                      print("C.P.D signal published.")
                  else:
                      print("Publish time not reached yet.")

              except Exception as e:
                  print("Publish check error:", e)
          else:
              print("No incoming signal requiring publication.")

      - name: Publish final signal state
        run: |
          mkdir -p cloud
          cp "$PROJECT_CLOUD/signals.json" cloud/signals.json

          git config user.name "C.P.D Cloud Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cloud/signals.json

          if git diff --cached --quiet; then
            echo "No final-state change."
          else
            git commit -m "Publish C.P.D signal after confirmation"
            git push
          fi
