name: C.P.D Cloud Market Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract C.P.D project
        run: |
          unzip -oq CPD_SUPER_WIZARD_AI_v1_8_1_CLOUD_QUALITY_FIXED.zip -d .cpd_cloud_project
          SCRIPT=$(find .cpd_cloud_project -type f -path '*/cloud/signal_worker.py' | head -n 1)
          test -n "$SCRIPT"
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PROJECT_CLOUD=$(dirname "$SCRIPT")" >> "$GITHUB_ENV"

      - name: Run C.P.D scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python3 "$SCRIPT"

      - name: Publish signal state
        run: |
          mkdir -p cloud
          cp "$PROJECT_CLOUD/signals.json" cloud/signals.json
          git config user.name "C.P.D Cloud Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/signals.json
          git diff --cached --quiet || git commit -m "Update C.P.D cloud signal state"
          git push
